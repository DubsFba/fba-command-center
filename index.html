<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FBA Command Center</title><style>:root{font-family:Inter,system-ui,Arial;background:#0b1220;color:#edf2fa}*{box-sizing:border-box}body{margin:0}header{padding:22px;background:#121e31;border-bottom:1px solid #30405a}h1{margin:0;font-size:25px}small,.muted{color:#9eafc6}nav{display:flex;gap:8px;overflow:auto;padding:14px;background:#101b2d}button,.btn{border:1px solid #34445d;background:#1b2b43;color:white;padding:10px 13px;border-radius:9px;cursor:pointer}button.active,.primary{background:#2674ed;border-color:#2674ed}main{max-width:1150px;margin:auto;padding:20px}.panel{background:#152238;border:1px solid #2b3d58;border-radius:14px;padding:18px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric{font-size:26px;font-weight:700;margin-top:9px}input,select{width:100%;padding:11px;border:1px solid #40536d;background:#0e192b;color:#fff;border-radius:8px}label{display:block;font-size:13px;color:#b8c8dd;margin:9px 0 4px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid #34445d;white-space:nowrap}a{color:#8db8ff}.tag{background:#243c5e;border-radius:7px;padding:4px 7px}h2{margin:4px 0 15px}h3{margin:0 0 10px}.hide{display:none}.notice{border-left:3px solid #6fa8ff;padding:10px;background:#1c304b;margin:12px 0}.danger{background:#702f39}footer{padding:20px;color:#9eafc6;text-align:center}button:focus,input:focus,select:focus{outline:2px solid #70a6ff}</style></head><body><header><h1>📦 FBA Command Center</h1><small>Product sourcing • Budget • Inventory • Finance • Wholesale-ready</small></header><nav id="nav"></nav><main id="app"></main><footer>Local-first prototype. Your data stays in this browser until exported. No live Amazon data connection.</footer><script>
const tabs=['Dashboard','Product Hunter','Suppliers','Local Deals','Inventory','Performance','Purchase Queue','Finances','Launch Setup','Settings'];const key='fba_cc_v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{}}catch{db={}};db={budget:250,reserve:20,products:[],transactions:[],localDeals:[],...db};db.localDeals ||= [];db.profitEvents ||= [];db.salesLog ||= [];db.purchaseQueue ||= [];db.reinvestPercent ??= 80;let tab='Dashboard';const $=id=>document.getElementById(id),money=n=>'$'+(Number(n)||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number(v)||0;const save=()=>{localStorage.setItem(key,JSON.stringify(db));render()};const profit=p=>num(p.price)-num(p.cost)-num(p.fee)-num(p.ship);const roi=p=>num(p.cost)+num(p.ship)>0?profit(p)/(num(p.cost)+num(p.ship))*100:0;const total=(type)=>db.transactions.filter(x=>x.type===type).reduce((s,x)=>s+num(x.amount),0);const pnl=()=>total('Revenue')-total('Expense')-total('Refund');const qty=p=>num(p.stock);const realizedProfit=()=>db.profitEvents.reduce((a,e)=>a+num(e.amount),0);const reinvested=()=>db.profitEvents.reduce((a,e)=>a+num(e.amount)*num(e.reinvestPercent)/100,0);const retained=()=>realizedProfit()-reinvested();const workingBudget=()=>Math.max(0,num(db.budget)+reinvested());const sourcingCap=()=>Math.max(0,workingBudget()*(1-num(db.reserve)/100));const qualified=d=>{let cost=num(d.cost),other=num(d.other),profit=num(d.price)-cost-num(d.fees)-other,roi=(cost+other)>0?100*profit/(cost+other):0;return d.approval==='yes'&&d.demandSource&&num(d.monthlySales)>=100&&d.priceSource&&d.feeSource&&d.stockVerified==='yes'&&d.priceStable==='yes'&&d.competitionOk==='yes'&&d.exactMatch==='yes'&&d.eligibilitySource&&d.historySource&&d.competitionSource&&d.matchSource&&profit>=5&&roi>=30&&cost*num(d.units)<=sourcingCap()&&cost>0&&num(d.units)>0};const nav=()=>{$('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('')};window.go=t=>{tab=t;render()};function card(t,v){return `<div class="panel"><small>${t}</small><div class="metric">${v}</div></div>`};function render(){nav();let out='';if(tab==='Dashboard'){let inventory=db.products.reduce((s,p)=>s+qty(p)*num(p.cost),0);out=`<h2>Business overview</h2><div class="cards">${card('Starting capital',money(db.budget))}${card('Reinvested realized profit',money(reinvested()))}${card('Retained profit allocation',money(retained()))}${card('Planning sourcing ceiling',money(sourcingCap()))}${card('Inventory at cost',money(inventory))}${card('Recorded net cash flow',money(pnl()))}${card('Tracked products',db.products.length)}${card('Units in stock',db.products.reduce((s,p)=>s+qty(p),0))}</div><div class="notice">Product demand is not verified. Enter real sales estimates from authorized research tools. Profit calculations are estimates until actual Amazon fees, taxes and expenses are recorded.</div><div class="panel"><h3>Reorder watch</h3>${db.products.filter(p=>qty(p)<=num(p.reorder)).map(p=>`<p>${esc(p.name)} — ${qty(p)} units left (reorder at ${num(p.reorder)})</p>`).join('')||'<p class="muted">No low-stock products yet.</p>'}</div>`}
if(tab==='Launch Setup'){out=`<h2>🚀 Live integration setup</h2><div class="notice"><b>Current status:</b> Offline local prototype. No retailer, Keepa, or Amazon credentials are connected. Never paste passwords, refresh tokens or API keys into this file. Production integration requires a secure server.</div><div class="cards">${card('Amazon SP-API','Not connected')}${card('Demand / history','Not connected')}${card('Retail feeds','Not connected')}${card('Cloud sync','Not connected')}</div><div class="panel"><h3>Step 1 · Amazon account access</h3><p>For a private app used only by your own business, register as an SP-API developer and self-authorize. Amazon may require a Professional seller plan. Authorization must happen through Amazon, not by entering your password here.</p><p><a target="_blank" rel="noopener noreferrer" href="https://developer-docs.amazon.com/sp-api/docs/onboarding-overview">Official SP-API onboarding guide</a> · <a target="_blank" rel="noopener noreferrer" href="https://developer-docs.amazon.com/sp-api/lang-en_EN/docs/sp-api-registration-overview">Registration requirements</a></p></div><div class="panel"><h3>Step 2 · Demand and sourcing</h3><p>Connect a licensed historical-pricing / demand provider (such as Keepa with API access), then retailer feeds or permitted sourcing integrations. Until evidence is available, no opportunity is automatically approved.</p><p><a href="https://keepa.com/#!api" target="_blank" rel="noopener noreferrer">Keepa API information</a></p></div><div class="panel"><h3>Step 3 · Production backend</h3><p>Deploy an authenticated server with encrypted secrets, database, scheduled scans, audit logs and rate limiting. This browser file intentionally cannot store sensitive integration credentials.</p></div><div class="panel"><h3>Purchase safety policy</h3><p>Manual purchasing only. The system can build a purchase queue but must never initiate checkout, charge cards or order stock. Eligibility and exact variation matching remain mandatory; estimates are never presented as verified sales.</p></div><div class="panel"><h3>Go-live acceptance checklist</h3><label><input type="checkbox" style="width:auto"> Amazon account linked with least-privilege permissions</label><label><input type="checkbox" style="width:auto"> Fees, taxes, shipping and prep costs independently checked</label><label><input type="checkbox" style="width:auto"> Demand, price history and Buy Box evidence connected</label><label><input type="checkbox" style="width:auto"> Retailer availability and exact variation match verified</label><label><input type="checkbox" style="width:auto"> Inventory and finance reconciled with real transactions</label><label><input type="checkbox" style="width:auto"> Secure cloud backups and alert delivery tested</label></div>`}
if(tab==='Local Deals'){let stores=[['Walmart – Wilmington Pike','6244 Wilmington Pike, Dayton, OH 45459','Walmart'],['Walmart – Kingsridge','8800 Kingsridge Dr, Dayton, OH 45458','Walmart'],['Target – Dayton South','2300 Miamisburg Centerville Rd, Dayton, OH 45459','Target'],['Target – Feedwire','4341 Feedwire Rd, Dayton, OH 45440','Target'],["Ollie’s Bargain Outlet",'221 N Springboro Pike, Dayton, OH 45449','Ollies'],['Marshalls','4317 Feedwire Rd, Centerville, OH 45440','Marshalls'],['Burlington','2122 Miamisburg Centerville Rd, Dayton, OH 45459','Burlington'],['Ross Dress for Less','2700 Miamisburg Centerville Rd, Dayton, OH 45459','Ross']];let spend=sourcingCap();out=`<h2>📍 Local Retail Deal Hunter</h2><div class="notice"><b>Strict 8-rule screening enabled:</b> Amazon eligibility; ≥$5 profit/unit; ≥30% ROI; evidence-backed demand ≥100 units/month; stable price history; manageable competition/Buy Box; within sourcing cap; exact ASIN/variation match. Unknown or missing evidence means NOT qualified. Self-entered evidence is not independently verified by this offline app.</div><div class="notice">Starting area: Centerville / Dayton, Ohio. Store locations are real; live shelf prices and stock are NOT connected. Use retailer/clearance links to check availability and verify in-store before buying. Budget: ${money(workingBudget())} planning capital · Reserve ${db.reserve}% · Planning allowance ${money(spend)}.</div><div class="cards">${card('Screened leads',db.localDeals.filter(qualified).length)}${card('Qualified purchase cost',money(db.localDeals.filter(qualified).reduce((a,d)=>a+num(d.cost)*num(d.units),0)))}${card('Qualified estimated profit',money(db.localDeals.filter(qualified).reduce((a,d)=>a+(num(d.price)-num(d.cost)-num(d.fees)-num(d.other))*num(d.units),0)))}</div><div class="panel"><h3>Research nearby stores</h3><div class="cards">${stores.map(st=>`<div class="panel"><b>${esc(st[0])}</b><p><small>${esc(st[1])}</small></p><p><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(st[1])}">Directions</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(st[2]+' clearance deals '+st[1])}">Search clearance</a></p></div>`).join('')}</div><p><a target="_blank" rel="noopener noreferrer" href="https://brickseek.com">BrickSeek local deals</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.target.com">Target stock lookup</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.walmart.com">Walmart stock lookup</a></p></div><div class="notice"><b>Qualified deals only:</b> A lead appears in your shortlist only with documented demand (100+ estimated monthly sales), at least $5 estimated profit/unit, 30%+ ROI, verified stock, current price and fee sources, confirmed selling eligibility, and a purchase cost within your sourcing allowance. Nothing is guaranteed. Leads that do not pass are saved privately for later review, not recommended.</div><div class="panel"><h3>Save a clearance find</h3><form id="localForm"><div class="form">${[['name','Product / exact variation','text'],['store','Retail store and location','text'],['upc','UPC / barcode','text'],['cost','Shelf price per unit ($)','number'],['price','Expected Amazon selling price ($)','number'],['fees','Estimated Amazon fees per unit ($)','number'],['other','Other costs per unit ($)','number'],['units','Quantity to buy','number'],['url','Product or deal URL','url'],['monthlySales','Estimated monthly Amazon sales (units)','number'],['demandSource','Demand evidence URL / provider','text'],['priceSource','Amazon price evidence URL / provider','text'],['feeSource','Amazon fee estimate source','text'],['eligibilitySource','Seller Central eligibility evidence / checked date','text'],['historySource','Price history evidence URL / provider','text'],['competitionSource','Competition and Buy Box evidence URL / provider','text'],['matchSource','Exact ASIN / variation matching evidence','text']].map(([k,l,t])=>`<label>${l}<input name="${k}" type="${t}" ${t==='number'?'min="0" step="any"':''} ${['name','store','cost','price','units'].includes(k)?'required':''}></label>`).join('')}</div><div class="form"><label>Allowed to sell exact ASIN?<select name="approval"><option value="unknown">Not checked</option><option value="yes">Yes, verified in Seller Central</option><option value="no">No</option></select></label><label>Store stock verified?<select name="stockVerified"><option value="unknown">Not checked</option><option value="yes">Yes, verified</option><option value="no">No</option></select></label><label>Stable price history?<select name="priceStable"><option value="unknown">Not checked</option><option value="yes">Yes, supported by history</option><option value="no">No</option></select></label><label>Low competition / manageable Buy Box risk?<select name="competitionOk"><option value="unknown">Not checked</option><option value="yes">Yes, supported by research</option><option value="no">No</option></select></label><label>Exact product and variation match?<select name="exactMatch"><option value="unknown">Not checked</option><option value="yes">Yes, verified</option><option value="no">No</option></select></label></div><p><button class="primary" type="submit">Save lead and evaluate</button></p></form></div><div class="panel"><h3>Screened local deal shortlist (user-attested, not independently verified)</h3><div class="tablewrap"><table><thead><tr><th>Product / store</th><th>Cost</th><th>Profit/unit</th><th>ROI</th><th>Qty</th><th>Action</th></tr></thead><tbody>${db.localDeals.filter(qualified).map(d=>{let net=num(d.price)-num(d.cost)-num(d.fees)-num(d.other),basis=num(d.cost)+num(d.other);return `<tr><td>${esc(d.name)}<br><small>${esc(d.store)} · ${esc(d.upc)}</small></td><td>${money(d.cost)}</td><td>${money(net)}</td><td>${basis>0?(100*net/basis).toFixed(1)+'%':'—'}</td><td>${esc(d.units)}</td><td>${safeLink(d.url)} <button onclick="deleteLocal('${d.id}')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="6">No verified high-demand, high-profit opportunities yet. Unqualified leads stay hidden.</td></tr>'}</tbody></table></div><small>These are user-entered estimates, not verified sales or approval to list. Check exact ASIN, brand restrictions, condition, sales history, and fee preview before buying. Retail receipts may not meet Amazon invoice requirements.</small></div>`}
if(tab==='Product Hunter'){let avail=sourcingCap();out=`<h2>Product Hunter</h2><div class="notice">Research workspace: add products and estimated monthly sales from your own sources. The app scores them by estimated demand, margin and ROI; it does not scrape Amazon or claim live sales volumes.</div><div class="panel"><h3>Add product opportunity</h3><form id="productForm"><div class="form">${[['name','Product name','text'],['asin','ASIN / SKU','text'],['price','Amazon sale price ($)','number'],['cost','Unit purchase cost ($)','number'],['fee','Estimated Amazon fees ($)','number'],['ship','Inbound shipping per unit ($)','number'],['sales','Estimated monthly sales (units)','number'],['stock','Units in stock','number'],['reorder','Reorder threshold','number'],['url','Supplier product URL','url'],['supplier','Supplier name','text'],['moq','Wholesale MOQ (optional)','number']].map(([id,label,type])=>`<div><label>${label}</label><input name="${id}" type="${type}" ${type==='number'?'min="0" step="any"':''} ${id==='name'?'required':''}></div>`).join('')}</div><p><button class="primary">Save product</button></p></form></div><div class="panel"><h3>Opportunities ranked by estimated monthly gross profit</h3><div class="tablewrap"><table><thead><tr><th>Product</th><th>Demand / mo.</th><th>Unit profit</th><th>ROI</th><th>Monthly potential*</th><th>Affordable units</th><th>Supplier</th><th></th></tr></thead><tbody>${[...db.products].sort((a,b)=>profit(b)*num(b.sales)-profit(a)*num(a.sales)).map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.asin)}</small></td><td>${num(p.sales)}</td><td>${money(profit(p))}</td><td>${roi(p).toFixed(1)}%</td><td>${money(profit(p)*num(p.sales))}</td><td>${num(p.cost)+num(p.ship)>0?Math.floor(avail/(num(p.cost)+num(p.ship))):'—'}</td><td>${safeLink(p.url)}</td><td><button onclick="removeProduct('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div><small>*Hypothetical only: assumes estimated monthly units sell at the entered price and costs.</small></div>`}
if(tab==='Suppliers'){out=`<h2>Supplier Finder & Wholesale Hub</h2><div class="notice">Supplier URLs are entered and verified by you. Automated cross-store matching, live prices and distributor feeds will require approved integrations.</div><div class="panel"><h3>Saved suppliers</h3><div class="tablewrap"><table><tr><th>Product</th><th>Supplier</th><th>MOQ</th><th>Unit cost</th><th>Buy link</th></tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.supplier||'Unassigned')}</td><td>${num(p.moq)||'—'}</td><td>${money(p.cost)}</td><td>${safeLink(p.url)}</td></tr>`).join('')}</table></div></div><div class="panel"><h3>Research retailers</h3><p><a target="_blank" rel="noopener noreferrer" href="https://www.walmart.com/">Walmart</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.target.com/">Target</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.costco.com/">Costco</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.amazon.com/">Amazon</a></p><small>Links are research starting points, not verified matched supplier offers. Check authenticity, invoices, brand restrictions, and Amazon selling eligibility before buying.</small></div>`}
if(tab==='Inventory'){out=`<h2>Inventory Manager</h2><div class="panel"><h3>Adjust stock</h3><form id="stockForm"><div class="form"><div><label>Product</label><select name="id" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Stock change (+ received / − sold)</label><input name="delta" type="number" step="1" required></div><div><label>Reason</label><select name="reason"><option>Received</option><option>Sold</option><option>Adjustment</option><option>Returned</option></select></div></div><p><button class="primary" ${!db.products.length?'disabled':''}>Update stock</button></p></form></div><div class="panel"><div class="tablewrap"><table><tr><th>Product</th><th>Stock</th><th>Reorder at</th><th>Status</th><th>Value at cost</th></tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${qty(p)}</td><td>${num(p.reorder)}</td><td>${qty(p)<=num(p.reorder)?'⚠ Low stock':'OK'}</td><td>${money(qty(p)*num(p.cost))}</td></tr>`).join('')}</table></div></div>`}
if(tab==='Performance'){let summary=db.products.map(p=>{let logs=db.salesLog.filter(x=>x.productId===p.id);let sold=logs.reduce((a,x)=>a+num(x.units),0);let revenue=logs.reduce((a,x)=>a+num(x.revenue),0);let costs=logs.reduce((a,x)=>a+num(x.totalCost),0);let earned=revenue-costs;let per=sold?earned/sold:0;let latest=logs.length?Math.max(...logs.map(x=>Date.parse(x.date)||0)):0;let days=latest?Math.max(1,Math.ceil((Date.now()-latest)/86400000)):null;let status=!sold?'NO SALES DATA':per<5||earned<=0?'AVOID / REVIEW':sold>=3&&per>=5&&roi(p)>=30?'REORDER CANDIDATE':'MONITOR';return {p,sold,revenue,earned,per,status,days}});out=`<h2>Product Performance & Reorders</h2><div class="notice">Actual performance uses sales you record below; estimates are never treated as actual sales. REORDER CANDIDATE is only a suggestion. Before reordering, reconfirm seller eligibility, current supplier cost, Amazon fees, price history and available cash. Purchases remain manual.</div><div class="cards">${card('Recorded units sold',summary.reduce((a,x)=>a+x.sold,0))}${card('Recorded sales profit',money(summary.reduce((a,x)=>a+x.earned,0)))}${card('Reorder candidates',summary.filter(x=>x.status==='REORDER CANDIDATE').length)}${card('Products needing review',summary.filter(x=>x.status==='AVOID / REVIEW').length)}</div><div class="panel"><h3>Record completed sales</h3><form id="salesForm"><div class="form"><div><label>Product</label><select name="productId" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Sale date</label><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></div><div><label>Units sold</label><input name="units" type="number" min="1" step="1" required></div><div><label>Total received from sales ($)</label><input name="revenue" type="number" min="0" step="0.01" required></div><div><label>Total COGS + all fees + shipping + refunds + costs ($)</label><input name="totalCost" type="number" min="0" step="0.01" required></div></div><p><button class="primary" ${!db.products.length?'disabled':''}>Record actual sales</button></p></form><small>Do not also enter the same sales into another profit allocation unless you intend to allocate it; recording sales here does not move money or automatically allocate profit.</small></div><div class="panel"><h3>Product ranking — recorded performance</h3><div class="tablewrap"><table><tr><th>Product</th><th>Units sold</th><th>Actual net profit</th><th>Profit / unit</th><th>Current stock</th><th>Recommendation</th><th>Action</th></tr>${summary.sort((a,b)=>b.earned-a.earned).map(x=>`<tr><td>${esc(x.p.name)}</td><td>${x.sold}</td><td>${money(x.earned)}</td><td>${money(x.per)}</td><td>${qty(x.p)}</td><td>${esc(x.status)}</td><td><button onclick="queueProduct('${x.p.id}')">Add to purchase queue</button></td></tr>`).join('')}</table></div></div><div class="panel"><h3>Recorded sales history</h3><div class="tablewrap"><table><tr><th>Date</th><th>Product</th><th>Units</th><th>Revenue</th><th>Costs</th><th>Net</th><th></th></tr>${db.salesLog.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(db.products.find(p=>p.id===x.productId)?.name||'Deleted product')}</td><td>${num(x.units)}</td><td>${money(x.revenue)}</td><td>${money(x.totalCost)}</td><td>${money(num(x.revenue)-num(x.totalCost))}</td><td><button onclick="deleteSale('${x.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`}
if(tab==='Purchase Queue'){let totalCost=db.purchaseQueue.reduce((a,q)=>{let p=db.products.find(x=>x.id===q.productId);return a+(p?(num(p.cost)+num(p.ship))*num(q.units):0)},0);out=`<h2>Manual Purchase Queue</h2><div class="notice">This queue is a planning list, NOT a checkout. No payments, retailer orders, or Amazon purchases are made. Recheck listing eligibility, exact variation, current price, tax, fees and stock before buying.</div><div class="cards">${card('Estimated queue cost',money(totalCost))}${card('Sourcing cap',money(sourcingCap()))}${card('Budget remaining',money(Math.max(0,sourcingCap()-totalCost)))}</div>${totalCost>sourcingCap()?'<div class="notice">⚠ Queue exceeds your sourcing cap. Reduce quantities before purchasing.</div>':''}<div class="panel"><h3>Products saved for review</h3><div class="tablewrap"><table><tr><th>Product</th><th>Supplier</th><th>Units</th><th>Estimated cost</th><th>Status</th><th></th></tr>${db.purchaseQueue.map(q=>{let p=db.products.find(x=>x.id===q.productId);return `<tr><td>${esc(p?.name||'Deleted product')}</td><td>${p?safeLink(p.url):'—'}</td><td><input aria-label="Quantity" style="max-width:75px" type="number" min="1" value="${num(q.units)}" onchange="queueQty('${q.id}',this.value)"></td><td>${money((num(p?.cost)+num(p?.ship))*num(q.units))}</td><td>${esc(q.status)}</td><td><button onclick="markPurchased('${q.id}')">Mark manually purchased</button> <button onclick="deleteQueue('${q.id}')">Remove</button></td></tr>`}).join('')}</table></div></div>`}
if(tab==='Finances'){out=`<h2>Finance Tracker</h2><div class="cards">${card('Revenue',money(total('Revenue')))}${card('Expenses',money(total('Expense')))}${card('Refunds',money(total('Refund')))}${card('Recorded net cash flow',money(pnl()))}</div><div class="cards">${card('Realized profit allocated',money(realizedProfit()))}${card('Reinvested into sourcing',money(reinvested()))}${card('Kept / owner allocation',money(retained()))}${card('Current planning ceiling',money(sourcingCap()))}</div><div class="notice"><b>Automatic 80/20 split:</b> Every confirmed profit entry is allocated using the reinvestment percentage active when recorded. The split is a planning allocation, not an automatic bank transfer. Profit entries are separate from cash transactions and are NOT added to recorded cash flow. Only record actual realized profit after cost of goods, Amazon fees, shipping, refunds and other relevant costs. Planning ceiling is not a verified bank balance; inventory purchases and cash obligations can reduce spendable funds.</div><div class="panel"><h3>Allocate confirmed realized profit</h3><form id="profitForm"><div class="form"><label>Date<input type="date" name="date" required value="${new Date().toLocaleDateString('en-CA')}"></label><label>Net realized profit ($)<input type="number" name="amount" step="0.01" min="0.01" required></label><label>Reference / settlement ID<input name="reference" placeholder="Amazon settlement or reconciliation" required></label></div><p><button class="primary">Allocate profit at ${num(db.reinvestPercent)}% reinvest / ${100-num(db.reinvestPercent)}% retained</button></p></form><h3>Profit allocations</h3><div class="tablewrap"><table><tr><th>Date</th><th>Reference</th><th>Profit</th><th>Reinvested</th><th>Kept</th><th></th></tr>${[...db.profitEvents].reverse().map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.reference)}</td><td>${money(e.amount)}</td><td>${money(num(e.amount)*num(e.reinvestPercent)/100)}</td><td>${money(num(e.amount)*(100-num(e.reinvestPercent))/100)}</td><td><button onclick="removeProfit('${e.id}')">Delete</button></td></tr>`).join('')}</table></div></div><div class="panel"><h3>Record transaction</h3><form id="txForm"><div class="form"><div><label>Date</label><input type="date" name="date" required value="${new Date().toLocaleDateString('en-CA')}"></div><div><label>Type</label><select name="type"><option>Revenue</option><option>Expense</option><option>Refund</option></select></div><div><label>Category</label><select name="category"><option>Amazon sales</option><option>Inventory purchase</option><option>Amazon fees</option><option>Shipping</option><option>Advertising</option><option>Software</option><option>Refund</option><option>Other</option></select></div><div><label>Amount ($)</label><input type="number" name="amount" min="0" step="0.01" required></div><div><label>Notes</label><input name="note"></div></div><p><button class="primary">Record</button></p></form></div><div class="panel"><h3>Ledger</h3><div class="tablewrap"><table><tr><th>Date</th><th>Type</th><th>Category</th><th>Amount</th><th>Notes</th><th></th></tr>${[...db.transactions].reverse().map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.type)}</td><td>${esc(t.category)}</td><td>${money(t.amount)}</td><td>${esc(t.note)}</td><td><button onclick="removeTx('${t.id}')">Delete</button></td></tr>`).join('')}</table></div></div><small>Manual ledger, not accounting or tax advice. Inventory purchases and sales must be recorded separately to avoid misrepresenting profit.</small>`}
if(tab==='Settings'){out=`<h2>Settings & data</h2><div class="notice">Your starting capital remains fixed. New realized profit automatically increases your planning budget by the selected reinvestment percentage. Existing allocations retain their original percentage when you change it.</div><div class="panel"><form id="settingsForm"><div class="form"><div><label>Total sourcing budget ($)</label><input name="budget" type="number" min="0" step="0.01" value="${db.budget}"></div><div><label>Cash reserve (%)</label><input name="reserve" type="number" min="0" max="100" step="1" value="${db.reserve}"></div><div><label>Reinvest realized profit (%)</label><input name="reinvestPercent" type="number" min="0" max="100" step="1" value="${db.reinvestPercent}"></div></div><p><button class="primary">Save budget and split</button></p></form></div><div class="panel"><h3>Backup and restore</h3><p><button onclick="exportData()">Export JSON backup</button> <button onclick="exportCSV()">Export products CSV</button></p><label>Restore JSON backup</label><input id="restore" type="file" accept="application/json,.json"><p><button class="danger" onclick="resetAll()">Erase local data</button></p><small>Browser storage can be cleared. Export regular backups. This is not yet a synced multi-device app.</small></div>`} $('app').innerHTML=out;wire()}
function safeLink(url){try{let u=new URL(url);return ['http:','https:'].includes(u.protocol)?`<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">Open offer</a>`:'—'}catch{return '—'}}function wire(){let lf=$('localForm');if(lf)lf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(lf));if(num(d.cost)*num(d.units)>sourcingCap()&&!confirm('This purchase exceeds your current sourcing allowance. Save anyway?'))return;d.id=crypto.randomUUID();db.localDeals.push(d);save();alert(qualified(d)?'Lead passes all 8 user-entered screening rules. Independently verify evidence and costs before buying.':'Lead saved, but hidden because it does not meet every evidence, demand, profit, eligibility and budget requirement.')};let f=$('productForm');if(f)f.onsubmit=e=>{e.preventDefault();let p=Object.fromEntries(new FormData(f));p.id=crypto.randomUUID();db.products.push(p);save()};f=$('stockForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));let p=db.products.find(p=>p.id===d.id);if(!p)return;let next=qty(p)+Number(d.delta);if(!Number.isInteger(Number(d.delta))||next<0)return alert('Enter a whole-number adjustment that does not make stock negative.');p.stock=next;save()};f=$('profitForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(num(d.amount)<=0)return alert('Enter positive realized profit.');db.profitEvents.push({...d,id:crypto.randomUUID(),reinvestPercent:num(db.reinvestPercent)});save()};f=$('txForm');if(f)f.onsubmit=e=>{e.preventDefault();let t=Object.fromEntries(new FormData(f));t.id=crypto.randomUUID();db.transactions.push(t);save()};f=$('settingsForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));db.budget=Math.max(0,num(d.budget));db.reserve=Math.max(0,Math.min(100,num(d.reserve)));db.reinvestPercent=Math.max(0,Math.min(100,num(d.reinvestPercent)));save()};let sf=$('salesForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(sf));if(num(d.units)<1||num(d.revenue)<0||num(d.totalCost)<0)return alert('Enter valid nonnegative amounts and at least one unit');db.salesLog.push({...d,id:crypto.randomUUID()});save()};let r=$('restore');if(r)r.onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.products)||!Array.isArray(d.transactions))throw Error('Invalid backup');if(confirm('Replace current data with backup?')){db=d;save()}}catch{alert('Invalid backup file')}}}
window.queueProduct=id=>{if(!db.products.some(p=>p.id===id))return;let q=db.purchaseQueue.find(q=>q.productId===id&&q.status==='Review');if(q)q.units+=1;else db.purchaseQueue.push({id:crypto.randomUUID(),productId:id,units:1,status:'Review'});save();go('Purchase Queue')};window.queueQty=(id,v)=>{let q=db.purchaseQueue.find(x=>x.id===id);if(q){q.units=Math.max(1,Math.floor(num(v)));save()}};window.deleteQueue=id=>{db.purchaseQueue=db.purchaseQueue.filter(q=>q.id!==id);save()};window.markPurchased=id=>{let q=db.purchaseQueue.find(x=>x.id===id);if(q&&confirm('Confirm you purchased these units outside this app? This only updates the queue status, not inventory or finances.')){q.status='Purchased externally — record inventory and expenses separately';save()}};window.deleteSale=id=>{if(confirm('Delete this sales record?')){db.salesLog=db.salesLog.filter(x=>x.id!==id);save()}};
window.removeProfit=id=>{if(confirm('Delete this profit allocation?')){db.profitEvents=db.profitEvents.filter(e=>e.id!==id);save()}};window.deleteLocal=id=>{if(confirm('Delete this local deal?')){db.localDeals=db.localDeals.filter(d=>d.id!==id);save()}};window.removeProduct=id=>{if(confirm('Delete this product?')){db.products=db.products.filter(p=>p.id!==id);save()}};window.removeTx=id=>{if(confirm('Delete this transaction?')){db.transactions=db.transactions.filter(t=>t.id!==id);save()}};function download(name,contents,type){let blob=new Blob([contents],{type});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}window.exportData=()=>download('fba-backup.json',JSON.stringify(db,null,2),'application/json');window.exportCSV=()=>{let cols=['name','asin','price','cost','fee','ship','sales','stock','reorder','supplier','url','moq'];let lines=[cols.join(','),...db.products.map(p=>cols.map(c=>'"'+String(p[c]??'').replace(/"/g,'""')+'"').join(','))];download('fba-products.csv',lines.join('\r\n'),'text/csv')};window.resetAll=()=>{if(confirm('Permanently erase all locally saved data?')){localStorage.removeItem(key);db={budget:250,reserve:20,products:[],transactions:[],localDeals:[],profitEvents:[],salesLog:[],purchaseQueue:[],reinvestPercent:80};save()}};render();</script></body></html>
